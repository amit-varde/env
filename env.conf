# -----------------------------------------------------------------------------
# File: env/env.conf
# Description: Where this repo lives. The one place to change it when you fork.
# -----------------------------------------------------------------------------
# Read by setup-env.sh (through lib/common.bash). Plain KEY=value lines, one per
# line; # starts a comment. It is PARSED, not sourced, so it cannot run
# commands. An environment variable of the same name always wins, so a one-off
# run can override any of these:
#
#   ENV_REPO=owner/name ./setup-env.sh
#
# bootstrap.sh cannot read this file: it runs on a machine that does not have
# the repo yet, so it carries its own copy of ENV_REPO. The two must agree, and
# tests/check-helper-drift.sh fails the build when they do not.
# -----------------------------------------------------------------------------

# GitHub repo this environment is cloned and updated from, as owner/name.
ENV_REPO=amit-varde/env

# Branch to clone and fast-forward.
ENV_BRANCH=main

# The original repo, when this one is a fork. setup-env.sh adds it as the
# `upstream` remote with pushing disabled, so changes go back through a PR.
# Leave empty when this is not a fork.
ENV_UPSTREAM=
